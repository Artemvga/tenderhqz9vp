<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR-квест «Образы Москвы»</title>
    
    <!-- Предзагрузка критических ресурсов -->
    <link rel="preload" href="assets/sprites/PNG/BG.png" as="image">
    <link rel="preload" href="assets/sprites/PNG/Button_BG_Color.png" as="image">
    
    <!-- Минимальные шрифты -->
    <style>
        @font-face {
            font-family: 'Inter Tight';
            src: url('assets/font/InterTight-Bold.woff2') format('woff2');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }
        
        @font-face {
            font-family: 'Inter Tight';
            src: url('assets/font/InterTight-Regular.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }
    </style>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            height: 100vh;
            font-family: 'Inter Tight', sans-serif;
            overflow: hidden;
            position: relative;
        }
        
        /* Фоновое изображение - твой PNG */
        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('assets/sprites/PNG/BG.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #000; /* Fallback цвет */
            z-index: 1;
        }
        
        /* Контент поверх фона */
        .content {
            position: relative;
            z-index: 2;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            color: white;
        }
        
        /* Заголовок */
        .title {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 30px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.8);
            line-height: 1.2;
        }
        
        .title-line {
            display: block;
        }
        
        /* Описание */
        .description {
            font-size: 1.4rem;
            font-weight: 400;
            max-width: 600px;
            margin-bottom: 50px;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.7);
            line-height: 1.5;
            padding: 0 20px;
        }
        
        /* Кнопка с твоим PNG */
        .button {
            padding: 20px 50px;
            font-size: 1.5rem;
            font-weight: 500;
            color: white;
            background-image: url('assets/sprites/PNG/Button_BG_Color.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            min-width: 250px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: hidden;
            transition: transform 0.2s;
        }
        
        .button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
        }
        
        .button span {
            position: relative;
            z-index: 1;
        }
        
        .button:hover {
            transform: scale(1.05);
        }
        
        .button:active {
            transform: scale(0.98);
        }
        
        /* Адаптивность */
        @media (max-width: 768px) {
            .title {
                font-size: 2.2rem;
                margin-bottom: 20px;
            }
            
            .description {
                font-size: 1.2rem;
                margin-bottom: 40px;
            }
            
            .button {
                padding: 18px 40px;
                font-size: 1.3rem;
                min-width: 220px;
            }
        }
        
        @media (max-width: 480px) {
            .title {
                font-size: 1.8rem;
            }
            
            .description {
                font-size: 1rem;
                margin-bottom: 30px;
                padding: 0 10px;
            }
            
            .button {
                padding: 16px 35px;
                font-size: 1.1rem;
                min-width: 200px;
            }
        }
        
        /* Индикатор загрузки фона */
        .loading {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 3;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 1.2rem;
            transition: opacity 0.3s;
        }
        
        .loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <!-- Индикатор загрузки -->
    <div class="loading" id="loading">
        Загрузка...
    </div>
    
    <!-- Фоновое изображение - твой PNG -->
    <div class="background" id="background"></div>
    
    <!-- Контент -->
    <div class="content" id="content" style="display: none;">
        <h1 class="title">
            <span class="title-line">AR-квест</span>
            <span class="title-line">«Образы Москвы»</span>
        </h1>
        
        <p class="description">
            Погрузитесь в атмосферу старой и современной Москвы сквозь шедевры русских художников.
        </p>
        
        <button class="button" onclick="goToARScene()">
            <span>➤ Сканировать картину</span>
        </button>
    </div>

    <script>
        function goToARScene() {
            window.location.href = "ar-scene.html";
        }
        
        // Оптимизированная загрузка
        document.addEventListener('DOMContentLoaded', function() {
            const loading = document.getElementById('loading');
            const background = document.getElementById('background');
            const content = document.getElementById('content');
            
            // Предзагрузка фонового изображения - твоего PNG
            const bgImage = new Image();
            bgImage.src = 'assets/sprites/PNG/BG.png';
            
            bgImage.onload = function() {
                // Когда твой PNG фон загружен, показываем контент
                setTimeout(function() {
                    loading.classList.add('hidden');
                    content.style.display = 'flex';
                    
                    // Предзагрузка кнопки PNG
                    const buttonImage = new Image();
                    buttonImage.src = 'assets/sprites/PNG/Button_BG_Color.png';
                }, 300);
            };
            
            bgImage.onerror = function() {
                // Если твой PNG не загрузился, используем fallback
                console.error('Не удалось загрузить фон:', bgImage.src);
                background.style.backgroundColor = '#2c3e50';
                loading.classList.add('hidden');
                content.style.display = 'flex';
            };
            
            // Таймаут на случай проблем с загрузкой
            setTimeout(function() {
                if (!loading.classList.contains('hidden')) {
                    loading.classList.add('hidden');
                    content.style.display = 'flex';
                }
            }, 3000);
            
            // Предотвращаем масштабирование на мобильных
            document.addEventListener('touchmove', function(e) {
                if (e.touches.length > 1) {
                    e.preventDefault();
                }
            }, { passive: false });
        });
    </script>
</body>
</html>
