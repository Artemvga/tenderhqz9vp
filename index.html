<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR-квест «Образы Москвы»</title>
    
    <!-- Минимальные шрифты -->
    <style>
        @font-face {
            font-family: 'Inter Tight';
            src: url('https://github.com/Artemvga/tenderhqz9vp/raw/gh-pages/assets/font/InterTight-Bold.woff2') format('woff2');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }
        
        @font-face {
            font-family: 'Inter Tight';
            src: url('https://github.com/Artemvga/tenderhqz9vp/raw/gh-pages/assets/font/InterTight-Regular.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }
    </style>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            height: 100vh;
            font-family: 'Inter Tight', sans-serif;
            overflow: hidden;
            position: relative;
            background: #0a0a1a;
        }
        
        /* Скрытое изображение для загрузки */
        .preload-image {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }
        
        /* Фоновое изображение - будет показано после полной загрузки */
        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #0a0a1a;
            z-index: 1;
            opacity: 0;
            transition: opacity 1s ease-out;
        }
        
        .background.loaded {
            opacity: 1;
        }
        
        /* Контент поверх фона */
        .content {
            position: relative;
            z-index: 2;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            color: white;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }
        
        .content.visible {
            opacity: 1;
            transform: translateY(0);
        }
        
        /* Заголовок */
        .title {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 30px;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 95, 39, 0.3);
            line-height: 1.2;
            background: linear-gradient(135deg, #ffffff 0%, #c2e9fb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .title-line {
            display: block;
        }
        
        /* Описание */
        .description {
            font-size: 1.4rem;
            font-weight: 400;
            max-width: 600px;
            margin-bottom: 50px;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.7);
            line-height: 1.5;
            padding: 0 20px;
            color: rgba(255, 255, 255, 0.9);
            opacity: 0;
            transform: translateY(10px);
            animation: fadeInUp 0.8s ease-out 0.3s forwards;
        }
        
        /* Кнопка с GitHub */
        .button {
            padding: 20px 50px;
            font-size: 1.5rem;
            font-weight: 500;
            color: white;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            min-width: 250px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            opacity: 0;
            transform: translateY(10px);
            animation: fadeInUp 0.8s ease-out 0.6s forwards;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.5), 0 0 30px rgba(255, 95, 39, 0.2);
        }
        
        .button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
        }
        
        .button span {
            position: relative;
            z-index: 1;
        }
        
        .button:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.6), 0 0 40px rgba(255, 95, 39, 0.3);
        }
        
        .button:active {
            transform: translateY(-2px) scale(0.98);
        }
        
        /* Адаптивность */
        @media (max-width: 768px) {
            .title {
                font-size: 2.2rem;
                margin-bottom: 20px;
            }
            
            .description {
                font-size: 1.2rem;
                margin-bottom: 40px;
            }
            
            .button {
                padding: 18px 40px;
                font-size: 1.3rem;
                min-width: 220px;
            }
        }
        
        @media (max-width: 480px) {
            .title {
                font-size: 1.8rem;
            }
            
            .description {
                font-size: 1rem;
                margin-bottom: 30px;
                padding: 0 10px;
            }
            
            .button {
                padding: 16px 35px;
                font-size: 1.1rem;
                min-width: 200px;
            }
        }
        
        /* Красивый экран загрузки с градиентом FF5F27 -> F130A0 */
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #FF5F27 0%, #F130A0 100%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
            overflow: hidden;
        }
        
        .loading.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(1.1);
        }
        
        .loading.instant-hidden {
            opacity: 0;
            pointer-events: none;
            display: none;
        }
        
        /* Анимированный логотип */
        .loading-logo {
            position: relative;
            width: 140px;
            height: 140px;
            margin-bottom: 30px;
        }
        
        .logo-circle {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid transparent;
            box-sizing: border-box;
        }
        
        .logo-circle-1 {
            border-top: 3px solid rgba(255, 255, 255, 0.9);
            border-right: 3px solid transparent;
            animation: rotate 2s linear infinite;
        }
        
        .logo-circle-2 {
            border-bottom: 3px solid rgba(255, 255, 255, 0.7);
            border-left: 3px solid transparent;
            animation: rotate 2.5s linear infinite reverse;
        }
        
        .logo-circle-3 {
            border: 3px solid rgba(255, 255, 255, 0.3);
            animation: pulse 2s ease-in-out infinite;
        }
        
        .logo-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 42px;
            color: white;
            font-weight: 700;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }
        
        /* Анимации */
        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes pulse {
            0%, 100% { 
                transform: scale(1); 
                opacity: 0.5; 
            }
            50% { 
                transform: scale(1.05); 
                opacity: 0.8; 
            }
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .loading-text {
            color: white;
            font-size: 1.3rem;
            margin-top: 15px;
            text-align: center;
            font-weight: 500;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            opacity: 0.9;
        }
        
        .loading-progress {
            width: 200px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            margin-top: 25px;
            overflow: hidden;
        }
        
        .loading-progress-bar {
            height: 100%;
            width: 0%;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 2px;
            animation: loadingProgress 2s ease-in-out infinite;
        }
        
        @keyframes loadingProgress {
            0% { 
                width: 0%; 
                margin-left: 0;
            }
            50% { 
                width: 100%; 
                margin-left: 0;
            }
            100% { 
                width: 0%; 
                margin-left: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- Скрытые изображения для предзагрузки -->
    <img class="preload-image" id="preloadBg" src="https://github.com/Artemvga/tenderhqz9vp/raw/gh-pages/assets/sprites/PNG/BG.png" alt="preload" crossorigin="anonymous">
    <img class="preload-image" id="preloadButton" src="https://github.com/Artemvga/tenderhqz9vp/raw/gh-pages/assets/sprites/PNG/Button_BG_Color.png" alt="preload" crossorigin="anonymous">
    
    <!-- Красивый экран загрузки -->
    <div class="loading" id="loading">
        <div class="loading-logo">
            <div class="logo-circle logo-circle-1"></div>
            <div class="logo-circle logo-circle-2"></div>
            <div class="logo-circle logo-circle-3"></div>
            <div class="logo-center">AR</div>
        </div>
        
        <div class="loading-text">Загрузка AR-квеста...</div>
        <div class="loading-progress">
            <div class="loading-progress-bar"></div>
        </div>
    </div>
    
    <!-- Фоновое изображение -->
    <div class="background" id="background"></div>
    
    <!-- Контент -->
    <div class="content" id="content">
        <h1 class="title">
            <span class="title-line">AR-квест</span>
            <span class="title-line">«Образы Москвы»</span>
        </h1>
        
        <p class="description">
            Погрузитесь в атмосферу старой и современной Москвы сквозь шедевры русских художников.
        </p>
        
        <button class="button" id="startButton">
            <span>➤ Сканировать картину</span>
        </button>
    </div>

    <script>
        function goToARScene() {
            window.location.href = "ar-scene.html";
        }
        
        // Проверка, были ли уже загружены изображения в этой сессии
        function areImagesCached() {
            try {
                const cacheState = localStorage.getItem('imagesCached');
                if (cacheState === 'true') {
                    // Проверяем действительно ли изображения в кэше браузера
                    const bgImg = document.getElementById('preloadBg');
                    const btnImg = document.getElementById('preloadButton');
                    
                    return bgImg.complete && bgImg.naturalHeight !== 0 &&
                           btnImg.complete && btnImg.naturalHeight !== 0;
                }
            } catch (e) {
                // localStorage может быть недоступен
                console.log('localStorage недоступен');
            }
            return false;
        }
        
        // Сохранение состояния кэширования
        function markImagesAsCached() {
            try {
                localStorage.setItem('imagesCached', 'true');
                // Сохраняем время кэширования
                localStorage.setItem('cacheTime', Date.now().toString());
            } catch (e) {
                // Игнорируем ошибки localStorage
            }
        }
        
        // Быстрая загрузка если изображения уже кэшированы
        function quickLoadIfCached() {
            if (areImagesCached()) {
                console.log('Используем кэшированные изображения');
                
                const loading = document.getElementById('loading');
                const background = document.getElementById('background');
                const content = document.getElementById('content');
                const startButton = document.getElementById('startButton');
                const preloadBg = document.getElementById('preloadBg');
                const preloadButton = document.getElementById('preloadButton');
                
                // Сразу устанавливаем фон и скрываем загрузку
                background.style.backgroundImage = `url('${preloadBg.src}')`;
                background.classList.add('loaded');
                startButton.style.backgroundImage = `url('${preloadButton.src}')`;
                
                // Сразу показываем контент, без анимации загрузки
                loading.classList.add('instant-hidden');
                content.classList.add('visible');
                
                return true;
            }
            return false;
        }
        
        // Основная загрузка - оптимизированная
        document.addEventListener('DOMContentLoaded', function() {
            // НЕМЕДЛЕННО показываем контент, если изображения в кэше
            if (quickLoadIfCached()) {
                // Сразу добавляем обработчик клика
                document.getElementById('startButton').addEventListener('click', goToARScene);
                return;
            }
            
            const loading = document.getElementById('loading');
            const background = document.getElementById('background');
            const content = document.getElementById('content');
            const startButton = document.getElementById('startButton');
            
            // УЖЕ показали загрузочный экран - не ждем
            // Сразу добавляем обработчик клика
            startButton.addEventListener('click', goToARScene);
            
            // Начинаем загрузку фона ПАРАЛЛЕЛЬНО с показом загрузочного экрана
            const bgUrl = 'https://github.com/Artemvga/tenderhqz9vp/raw/gh-pages/assets/sprites/PNG/BG.png';
            const buttonUrl = 'https://github.com/Artemvga/tenderhqz9vp/raw/gh-pages/assets/sprites/PNG/Button_BG_Color.png';
            
            // Загружаем изображения параллельно
            Promise.all([
                loadImage(bgUrl),
                loadImage(buttonUrl)
            ]).then(function(results) {
                const [bgImg, buttonImg] = results;
                
                // Отмечаем что изображения кэшированы
                markImagesAsCached();
                
                // Устанавливаем фон СРАЗУ
                background.style.backgroundImage = `url('${bgImg.src}')`;
                background.classList.add('loaded');
                
                // Устанавливаем фон кнопки
                startButton.style.backgroundImage = `url('${buttonImg.src}')`;
                
                // Минимальная задержка для плавности
                setTimeout(function() {
                    loading.classList.add('hidden');
                    setTimeout(function() {
                        content.classList.add('visible');
                    }, 200);
                }, 300);
                
            }).catch(function(error) {
                console.error('Ошибка загрузки:', error);
                
                // Fallback на градиенты при ошибке
                background.style.background = 'linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 100%)';
                background.classList.add('loaded');
                
                startButton.style.backgroundImage = 'linear-gradient(135deg, #FF5F27 0%, #F130A0 100%)';
                
                // Все равно показываем контент
                setTimeout(function() {
                    loading.classList.add('hidden');
                    setTimeout(function() {
                        content.classList.add('visible');
                    }, 200);
                }, 300);
            });
            
            // Функция для загрузки изображения с таймаутом
            function loadImage(url) {
                return new Promise(function(resolve, reject) {
                    const img = new Image();
                    img.crossOrigin = "anonymous";
                    
                    const timeoutId = setTimeout(function() {
                        reject(new Error('Таймаут загрузки изображения'));
                        img.onload = img.onerror = null;
                    }, 5000); // 5 секунд таймаут
                    
                    img.onload = function() {
                        clearTimeout(timeoutId);
                        resolve(img);
                    };
                    
                    img.onerror = function(err) {
                        clearTimeout(timeoutId);
                        reject(err);
                    };
                    
                    img.src = url;
                    
                    // Если изображение уже загружено (из кэша)
                    if (img.complete && img.naturalHeight !== 0) {
                        clearTimeout(timeoutId);
                        resolve(img);
                    }
                });
            }
            
            // Предзагрузка других ресурсов (не блокирующая)
            setTimeout(function() {
                const otherResources = [
                    'https://github.com/Artemvga/tenderhqz9vp/raw/gh-pages/assets/sprites/PNG/Button_Back.png',
                    'https://github.com/Artemvga/tenderhqz9vp/raw/gh-pages/assets/sprites/PNG/POI_Dot.png',
                    'https://raw.githubusercontent.com/Artemvga/tenderhqz9vp/gh-pages/assets/marker.patt'
                ];
                
                otherResources.forEach(url => {
                    if (url.endsWith('.patt')) {
                        // Загрузка паттерна
                        fetch(url, {mode: 'cors'});
                    } else {
                        // Загрузка изображений
                        const img = new Image();
                        img.crossOrigin = "anonymous";
                        img.src = url;
                    }
                });
            }, 100);
            
            // Таймаут на случай проблем с загрузкой (сокращен до 3 секунд)
            setTimeout(function() {
                if (!loading.classList.contains('hidden') && !loading.classList.contains('instant-hidden')) {
                    console.log('Таймаут загрузки, показываем контент');
                    
                    // Fallback на градиенты
                    background.style.background = 'linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 100%)';
                    background.classList.add('loaded');
                    
                    startButton.style.backgroundImage = 'linear-gradient(135deg, #FF5F27 0%, #F130A0 100%)';
                    
                    loading.classList.add('hidden');
                    
                    setTimeout(function() {
                        content.classList.add('visible');
                    }, 200);
                }
            }, 3000); // Уменьшено с 8 до 3 секунд
        });
        
        // При возврате на страницу проверяем кэш
        window.addEventListener('pageshow', function(event) {
            if (event.persisted) {
                // Страница загружена из кэша браузера
                console.log('Страница загружена из кэша браузера');
                quickLoadIfCached();
            }
        });
    </script>
</body>
</html>
