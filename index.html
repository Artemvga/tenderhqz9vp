    </style>
    
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-image: url('assets/sprites/PNG/BG.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: 'Inter Tight', sans-serif;
        }
        
        .container {
            text-align: center;
            padding: 50px 40px;
            max-width: 600px;
            width: 85%;
            margin: 20px;
        }
        
        /* Главный заголовок - ExtraBold (800) */
        .title {
            font-size: 2.8rem;
            color: white;
            margin: 0 0 25px 0;
            line-height: 1.2;
            font-weight: 800; /* ExtraBold */
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
            letter-spacing: -0.5px;
        }
        
        .title-line-1 {
            display: block;
            font-size: 2.2rem;
            color: white;
            margin-bottom: 8px;
            font-weight: 800; /* ExtraBold */
        }
        
        .title-line-2 {
            display: block;
            font-size: 2.8rem;
            color: white;
            font-weight: 800; /* ExtraBold */
        }
        
        /* Описание - Regular (400) */
        .description {
            font-size: 1.3rem;
            color: white;
            line-height: 1.6;
            margin: 0 0 35px 0;
            padding: 0 10px;
            text-align: center;
            font-weight: 400; /* Regular */
            text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.6);
        }
        
        /* Кнопка - Medium (500), при наведении SemiBold (600) */
        .button {
            padding: 22px 50px;
            font-size: 1.4rem;
            background-image: url('assets/sprites/PNG/Button_BG_Color.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: transparent;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            font-weight: 500; /* Medium */
            letter-spacing: 0.5px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
            min-height: 70px;
            min-width: 200px;
            position: relative;
            overflow: hidden;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
        }
        
        .button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            z-index: 1;
        }
        
        .button span {
            position: relative;
            z-index: 2;
        }
        
        .button:hover {
            background-image: url('assets/sprites/PNG/Button_BG_Color.png');
            background-size: cover;
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
            font-weight: 600; /* SemiBold при наведении */
        }
        
        .button:hover::before {
            background-color: rgba(0, 0, 0, 0.1);
        }
        
        .button:active {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">
            <span class="title-line-1">AR-квест</span>
            <span class="title-line-2">«Образы Москвы»</span>
        </h1>
        
        <p class="description">
            Погрузитесь в атмосферу старой и современной Москвы сквозь шедевры русских художников.
        </p>
        
        <button class="button" onclick="goToARScene()">
            <span>Сканировать картину</span>
        </button>
    </div>

    <script>
        function goToARScene() {
            window.location.href = "ar-scene.html";
        }
    </script>
</body>
</html>
