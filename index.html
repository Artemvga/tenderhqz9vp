<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR-квест «Образы Москвы»</title>
    
    <!-- Минимальные шрифты -->
    <style>
        @font-face {
            font-family: 'Inter Tight';
            src: url('assets/font/InterTight-Bold.woff2') format('woff2');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }
        
        @font-face {
            font-family: 'Inter Tight';
            src: url('assets/font/InterTight-Regular.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }
    </style>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            height: 100vh;
            font-family: 'Inter Tight', sans-serif;
            overflow: hidden;
            position: relative;
            background: #0a0a1a;
        }
        
        /* Скрытое изображение для загрузки */
        .preload-image {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }
        
        /* Фоновое изображение */
        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #0a0a1a;
            z-index: 1;
            opacity: 0;
            transition: opacity 0.5s ease-out;
        }
        
        .background.loaded {
            opacity: 1;
        }
        
        /* Контент */
        .content {
            position: relative;
            z-index: 2;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            color: white;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.5s ease-out, transform 0.5s ease-out;
        }
        
        .content.visible {
            opacity: 1;
            transform: translateY(0);
        }
        
        /* Заголовок */
        .title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
            line-height: 1.2;
            color: white;
        }
        
        .title-line {
            display: block;
        }
        
        /* Описание */
        .description {
            font-size: 1.2rem;
            font-weight: 400;
            max-width: 500px;
            margin-bottom: 40px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.7);
            line-height: 1.4;
            padding: 0 15px;
            color: rgba(255, 255, 255, 0.9);
        }
        
        /* Кнопка */
        .button {
            padding: 16px 40px;
            font-size: 1.3rem;
            font-weight: 500;
            color: white;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            min-width: 200px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: hidden;
            transition: transform 0.2s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }
        
        .button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }
        
        .button span {
            position: relative;
            z-index: 1;
        }
        
        .button:hover {
            transform: scale(1.03);
        }
        
        .button:active {
            transform: scale(0.98);
        }
        
        /* Адаптивность */
        @media (max-width: 768px) {
            .title {
                font-size: 2rem;
                margin-bottom: 15px;
            }
            
            .description {
                font-size: 1rem;
                margin-bottom: 30px;
            }
            
            .button {
                padding: 14px 35px;
                font-size: 1.1rem;
                min-width: 180px;
            }
        }
        
        @media (max-width: 480px) {
            .title {
                font-size: 1.6rem;
            }
            
            .description {
                font-size: 0.9rem;
                margin-bottom: 25px;
                padding: 0 10px;
            }
            
            .button {
                padding: 12px 30px;
                font-size: 1rem;
                min-width: 160px;
            }
        }
        
        /* Экран загрузки */
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #FF5F27 0%, #F130A0 100%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.3s ease-out;
        }
        
        .loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .loading.instant-hidden {
            display: none;
        }
        
        /* Логотип */
        .loading-logo {
            position: relative;
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
        }
        
        .logo-circle {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid transparent;
        }
        
        .logo-circle-1 {
            border-top: 2px solid rgba(255, 255, 255, 0.9);
            animation: rotate 1.5s linear infinite;
        }
        
        .logo-circle-2 {
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        
        .logo-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: white;
            font-weight: 700;
        }
        
        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-text {
            color: white;
            font-size: 1rem;
            margin-top: 10px;
            text-align: center;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <!-- Скрытые изображения -->
    <img class="preload-image" id="preloadBg" src="assets/sprites/PNG/BG.png" alt="preload">
    <img class="preload-image" id="preloadButton" src="assets/sprites/PNG/Button_BG_Color.png" alt="preload">
    
    <!-- Экран загрузки -->
    <div class="loading" id="loading">
        <div class="loading-logo">
            <div class="logo-circle logo-circle-1"></div>
            <div class="logo-circle logo-circle-2"></div>
            <div class="logo-center">AR</div>
        </div>
        <div class="loading-text">Загрузка...</div>
    </div>
    
    <!-- Фон -->
    <div class="background" id="background"></div>
    
    <!-- Контент -->
    <div class="content" id="content">
        <h1 class="title">
            <span class="title-line">AR-квест</span>
            <span class="title-line">«Образы Москвы»</span>
        </h1>
        
        <p class="description">
            Погрузитесь в атмосферу старой и современной Москвы сквозь шедевры русских художников.
        </p>
        
        <button class="button" id="startButton">
            <span>➤ Сканировать картину</span>
        </button>
    </div>

    <script>
        function goToARScene() {
            window.location.href = "ar-scene.html";
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            const loading = document.getElementById('loading');
            const background = document.getElementById('background');
            const content = document.getElementById('content');
            const startButton = document.getElementById('startButton');
            const preloadBg = document.getElementById('preloadBg');
            const preloadButton = document.getElementById('preloadButton');
            
            // Проверяем кэш
            if (preloadBg.complete && preloadButton.complete) {
                // Быстрая загрузка из кэша
                background.style.backgroundImage = `url('${preloadBg.src}')`;
                startButton.style.backgroundImage = `url('${preloadButton.src}')`;
                loading.classList.add('instant-hidden');
                background.classList.add('loaded');
                content.classList.add('visible');
                return;
            }
            
            // Обычная загрузка
            let imagesLoaded = 0;
            const totalImages = 2;
            
            function checkAllLoaded() {
                imagesLoaded++;
                if (imagesLoaded === totalImages) {
                    setTimeout(() => {
                        background.style.backgroundImage = `url('${preloadBg.src}')`;
                        startButton.style.backgroundImage = `url('${preloadButton.src}')`;
                        loading.classList.add('hidden');
                        setTimeout(() => {
                            background.classList.add('loaded');
                            content.classList.add('visible');
                        }, 100);
                    }, 300);
                }
            }
            
            if (preloadBg.complete) {
                checkAllLoaded();
            } else {
                preloadBg.onload = checkAllLoaded;
            }
            
            if (preloadButton.complete) {
                checkAllLoaded();
            } else {
                preloadButton.onload = checkAllLoaded;
            }
            
            // Таймаут
            setTimeout(() => {
                if (!loading.classList.contains('hidden')) {
                    loading.classList.add('hidden');
                    background.classList.add('loaded');
                    content.classList.add('visible');
                }
            }, 3000);
            
            startButton.addEventListener('click', goToARScene);
        });
    </script>
</body>
</html>
