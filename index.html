<!DOCTYPE html>
<html>
<head>
    <title>AR Experience</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }
        .button {
            padding: 20px 40px;
            font-size: 18px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <button class="button" onclick="goToARScene()">
        Перейти к AR сцене
    </button>

    <script>
        function goToARScene() {
            // Переход на страницу с AR сценой
            window.location.href = "ar-scene.html";
        }
    </script>
</body>
</html>
