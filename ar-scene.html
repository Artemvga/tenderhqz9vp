<!doctype html>
<html>
<head>
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>
    <style>
        /* Минимальные стили */
        body {
            margin: 0;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        
        /* Простая кнопка назад */
        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 60px;
            height: 60px;
            background: transparent;
            border: none;
            cursor: pointer;
            z-index: 1000;
            padding: 0;
        }
        
        .back-button img {
            width: 100%;
            height: 100%;
        }
        
        /* Скрываем все UI элементы */
        .a-enter-vr,
        .a-orientation-modal,
        .a-dialog,
        .arjs-loader,
        .arjs-detect {
            display: none !important;
        }
        
        /* Canvas на весь экран */
        a-scene, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <!-- Простая кнопка назад -->
    <button class="back-button" onclick="goBack()" title="Назад">
        <img src="assets/sprites/PNG/Button_Back.png" alt="Назад">
    </button>

    <!-- AR сцена без лишних настроек -->
    <a-scene
        vr-mode-ui="enabled: false"
        loading-screen="enabled: false"
        embedded
        arjs="sourceType: webcam; debugUIEnabled: false;"
    >
        <a-marker
            type="pattern"
            preset="custom"
            url="assets/marker.patt"
            raycaster="objects: .clickable"
            cursor="rayOrigin: mouse"
        >
            <a-image
                src="assets/sprites/PNG/POI_Dot.png"
                position="0 0 0"
                scale="0.5 0.5 0.5"
                class="clickable"
                gesture-handler="minScale: 0.25; maxScale: 1.5"
            ></a-image>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        function goBack() {
            window.location.href = "index.html";
        }
        
        // Обработка Escape
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                goBack();
            }
        });
        
        // Принудительно скрываем все UI элементы
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
                // Скрываем все элементы A-Frame UI
                const elements = document.querySelectorAll('.a-enter-vr, .a-orientation-modal, .a-dialog, .arjs-loader');
                elements.forEach(el => {
                    if (el) el.style.display = 'none';
                });
            }, 100);
        });
    </script>
</body>
</html>
