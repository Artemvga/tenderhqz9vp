<!doctype html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>
    <style>
        /* Минимальные стили */
        body {
            margin: 0;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        
        /* Простая кнопка назад */
        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 60px;
            height: 60px;
            background: transparent;
            border: none;
            cursor: pointer;
            z-index: 1000;
            padding: 0;
        }
        
        .back-button img {
            width: 100%;
            height: 100%;
        }
        
        /* Скрываем все UI элементы */
        .a-enter-vr,
        .a-orientation-modal,
        .a-dialog,
        .arjs-loader,
        .arjs-detect {
            display: none !important;
        }
        
        /* Canvas на весь экран */
        a-scene, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        /* Панель с информацией */
        .info-panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            background: rgba(10, 10, 26, 0.9);
            border-radius: 15px;
            padding: 30px;
            box-sizing: border-box;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            z-index: 2000;
            color: white;
            font-family: 'Inter Tight', sans-serif;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 95, 39, 0.3);
        }
        
        .info-panel.visible {
            display: flex;
        }
        
        .info-panel h2 {
            font-size: 24px;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #ffffff 0%, #c2e9fb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .info-panel p {
            font-size: 16px;
            line-height: 1.4;
            margin-bottom: 20px;
            color: rgba(255, 255, 255, 0.9);
        }
        
        .panel-close-button {
            width: 100%;
            height: 60px;
            background-image: url('https://github.com/Artemvga/tenderhqz9vp/raw/gh-pages/assets/sprites/PNG/Button_BG_Color.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 500;
            color: white;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.6);
        }
        
        .panel-close-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }
        
        .panel-close-button span {
            position: relative;
            z-index: 1;
        }
        
        /* Заглушка для кликов вне панели */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            z-index: 1999;
        }
        
        .overlay.visible {
            display: block;
        }
    </style>
</head>

<body>
    <!-- Простая кнопка назад -->
    <button class="back-button" onclick="goBack()" title="Назад">
        <img src="https://github.com/Artemvga/tenderhqz9vp/raw/gh-pages/assets/sprites/PNG/Button_Back.png" alt="Назад">
    </button>
    
    <!-- Панель с информацией -->
    <div class="overlay" id="overlay"></div>
    <div class="info-panel" id="infoPanel">
        <div>
            <h2>AR-квест</h2>
            <p>Погрузитесь в атмосферу старой и современной Москвы сквозь шедевры русских художников.</p>
        </div>
        <button class="panel-close-button" id="closePanel">
            <span>Закрыть</span>
        </button>
    </div>

    <!-- AR сцена с правильными настройками для мобильных -->
    <a-scene
        vr-mode-ui="enabled: false"
        loading-screen="enabled: false"
        renderer="logarithmicDepthBuffer: true;"
        embedded
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3; trackingMethod: best;"
        gesture-detector
    >
        <!-- Добавляем a-assets для правильной загрузки изображений -->
        <a-assets>
            <img id="poi-image" src="https://raw.githubusercontent.com/Artemvga/tenderhqz9vp/gh-pages/assets/sprites/PNG/POI_Dot.png" crossorigin="anonymous">
        </a-assets>
        
        <a-marker
            type="pattern"
            preset="custom"
            url="assets/marker.patt"
            id="main-marker"
            emitevents="true"
            cursor="rayOrigin: mouse"
        >
            <a-image
                id="poi-dot"
                src="#poi-image"
                position="0 0 0"
                rotation="-90 0 0"
                scale="0.2 0.2 0.2"
                class="clickable"
                gesture-handler
                material="side: double; transparent: true; alphaTest: 0.5;"
            ></a-image>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        function goBack() {
            window.location.href = "index.html";
        }
        
        // Обработка Escape
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                const infoPanel = document.getElementById('infoPanel');
                if (infoPanel && infoPanel.classList.contains('visible')) {
                    closeInfoPanel();
                } else {
                    goBack();
                }
            }
        });
        
        // Принудительно скрываем все UI элементы
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
                const elements = document.querySelectorAll('.a-enter-vr, .a-orientation-modal, .a-dialog, .arjs-loader');
                elements.forEach(el => {
                    if (el) el.style.display = 'none';
                });
            }, 100);
            
            // Запрос доступа к камере для мобильных устройств
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: 'environment',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    } 
                }).then(function(stream) {
                    console.log('Camera access granted');
                    // Останавливаем поток, AR.js сам его откроет
                    stream.getTracks().forEach(track => track.stop());
                }).catch(function(err) {
                    console.error('Camera access error:', err);
                    alert('Пожалуйста, разрешите доступ к камере для работы AR');
                });
            }
        });
        
        // Ждем полной загрузки сцены
        document.querySelector('a-scene').addEventListener('loaded', function() {
            console.log('Scene loaded');
            
            const poiElement = document.querySelector('#poi-dot');
            const marker = document.querySelector('#main-marker');
            
            if (poiElement) {
                console.log('POI element found');
                
                // Обработчик клика для десктопа
                poiElement.addEventListener('click', function(evt) {
                    console.log('POI clicked!');
                    openInfoPanel();
                    evt.stopPropagation();
                });
            }
            
            if (marker) {
                console.log('Marker found');
                
                // Обработчик для мобильных устройств - клик на маркер
                marker.addEventListener('click', function(evt) {
                    console.log('Marker area clicked');
                    openInfoPanel();
                });
            }
            
            // Глобальный обработчик тапа для мобильных
            const canvas = document.querySelector('a-scene > canvas');
            if (canvas) {
                canvas.addEventListener('touchend', function(evt) {
                    console.log('Canvas touched');
                    // Проверяем виден ли маркер
                    if (marker && marker.object3D.visible) {
                        console.log('Marker is visible, opening panel');
                        openInfoPanel();
                    }
                }, { passive: true });
            }
        });
        
        // Отслеживание видимости маркера
        let markerVisible = false;
        const marker = document.querySelector('#main-marker');
        
        if (marker) {
            marker.addEventListener('markerFound', function() {
                console.log('Marker found!');
                markerVisible = true;
            });
            
            marker.addEventListener('markerLost', function() {
                console.log('Marker lost!');
                markerVisible = false;
            });
        }
        
        // Функции для работы с панелью информации
        function openInfoPanel() {
            console.log('Opening info panel');
            const infoPanel = document.getElementById('infoPanel');
            const overlay = document.getElementById('overlay');
            
            if (infoPanel && overlay) {
                infoPanel.classList.add('visible');
                overlay.classList.add('visible');
                
                // Добавляем обработчик клика на оверлей для закрытия панели
                overlay.onclick = closeInfoPanel;
            }
        }
        
        function closeInfoPanel() {
            console.log('Closing info panel');
            const infoPanel = document.getElementById('infoPanel');
            const overlay = document.getElementById('overlay');
            
            if (infoPanel && overlay) {
                infoPanel.classList.remove('visible');
                overlay.classList.remove('visible');
                overlay.onclick = null;
            }
        }
        
        // Инициализация кнопки закрытия панели
        window.addEventListener('load', function() {
            const closeButton = document.getElementById('closePanel');
            if (closeButton) {
                closeButton.addEventListener('click', closeInfoPanel);
            }
        });
    </script>
</body>
</html>
