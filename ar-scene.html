<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>AR scene – 2 POI + conditional cursor</title>

    <!-- Используем стабильные CDN версии -->
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.3.0/dist/aframe-master.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.3/aframe/build/aframe-ar.js"></script>

    <style>
        body { 
            margin:0; 
            overflow:hidden; 
            width:100vw; 
            height:100vh; 
            -webkit-user-select: none; 
            user-select: none;
            font-family: Arial, sans-serif;
        }
        
        .back-button { 
            position: fixed; 
            top:20px; 
            left:20px; 
            z-index:1000; 
            background:rgba(255,95,39,0.9); 
            border:none; 
            cursor:pointer; 
            width:60px; 
            height:60px; 
            padding:10px;
            border-radius: 50%;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .back-button img { 
            width:100%; 
            height:100%; 
            pointer-events: none; 
        }

        /* Панель информации */
        .info-panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
            width: 320px;
            max-width: 90%;
            background: rgba(10,10,26,0.95);
            color: #fff;
            padding: 24px;
            border-radius: 14px;
            display: none;
            z-index: 2000;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            border: 2px solid rgba(255,95,39,0.18);
        }
        .info-panel.visible { display: block; }
        .info-panel h2 { margin: 0 0 12px 0; font-size:20px; }
        .info-panel p { margin: 0 0 18px 0; font-size:15px; color: rgba(255,255,255,0.9); }
        .panel-close-button { 
            width:100%; 
            padding:14px; 
            border-radius:10px; 
            border:none; 
            cursor:pointer; 
            font-size:16px; 
            font-weight:600; 
            background: linear-gradient(135deg, #FF5F27 0%, #F130A0 100%);
            color:#fff; 
            position:relative; 
            overflow:hidden;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .overlay { 
            position: fixed; 
            inset:0; 
            background: rgba(0,0,0,0.5); 
            display:none; 
            z-index:1999;
            -webkit-tap-highlight-color: transparent;
        }
        .overlay.visible { display:block; }

        /* Экран загрузки */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #FF5F27 0%, #F130A0 100%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            transition: opacity 0.5s;
        }
        
        .loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .loading-text {
            font-size: 1.2rem;
            margin-top: 20px;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Сообщение об ошибке */
        .error-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 59, 48, 0.95);
            color: white;
            padding: 30px;
            border-radius: 15px;
            z-index: 10000;
            display: none;
            text-align: center;
            max-width: 80%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        
        .error-message.visible {
            display: block;
        }
        
        .error-message h3 {
            margin: 0 0 15px 0;
            font-size: 1.3rem;
        }
        
        .error-message p {
            margin: 0 0 20px 0;
            font-size: 0.95rem;
            line-height: 1.4;
        }
        
        .error-button {
            background: white;
            color: #FF3B30;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin: 5px;
        }

        /* Скрываем элементы A-Frame UI */
        .a-enter-vr, .a-orientation-modal, .a-dialog, .arjs-loader { 
            display:none !important; 
        }
        
        /* Инструкция */
        .instruction {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 15px 25px;
            border-radius: 25px;
            z-index: 100;
            font-size: 0.9rem;
            text-align: center;
            max-width: 80%;
        }
    </style>
</head>
<body>
    <!-- Экран загрузки -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-spinner"></div>
        <div class="loading-text">Инициализация AR...</div>
    </div>

    <!-- Сообщение об ошибке -->
    <div class="error-message" id="errorMessage">
        <h3>Ошибка доступа к камере</h3>
        <p id="errorText">Для работы AR необходим доступ к камере.</p>
        <button class="error-button" id="retryButton">Повторить</button>
        <button class="error-button" id="backFromError">Назад</button>
    </div>

    <button class="back-button" id="backButton" title="Назад">
        <img src="https://github.com/Artemvga/tenderhqz9vp/raw/gh-pages/assets/sprites/PNG/Button_Back.png" alt="←">
    </button>

    <div class="instruction" id="instruction">Наведите камеру на маркер</div>

    <div class="overlay" id="overlay"></div>

    <div class="info-panel" id="infoPanel">
        <div id="panelContent">
            <h2 id="panelTitle">Заголовок</h2>
            <p id="panelDesc">Описание...</p>
        </div>
        <button class="panel-close-button" id="closePanel"><span>Закрыть</span></button>
    </div>

    <!-- AR сцена -->
    <a-scene
        id="arScene"
        vr-mode-ui="enabled: false"
        loading-screen="enabled: false"
        renderer="logarithmicDepthBuffer: true; colorManagement: true; sortObjects: true;"
        embedded
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono; trackingMethod: best; sourceWidth: 1280; sourceHeight: 960; displayWidth: 1280; displayHeight: 960;"
    >
        <a-assets timeout="10000">
            <img id="poi-image" crossorigin="anonymous" src="https://raw.githubusercontent.com/Artemvga/tenderhqz9vp/gh-pages/assets/sprites/PNG/POI_Dot.png">
        </a-assets>

        <!-- Маркер - используем встроенный Hiro маркер для тестирования -->
        <a-marker
            id="mainMarker"
            preset="hiro"
            raycaster="objects: .clickable"
            emitevents="true"
        >
            <!-- Два POI -->
            <a-plane
                id="poi-dot-1"
                class="clickable poi"
                src="#poi-image"
                position="-0.5 0 0"
                rotation="-90 0 0"
                scale="0.5 0.5 0.5"
                material="transparent: true; alphaTest: 0.5; side: double;"
                data-title="Портрет 1 – Иван Иванов"
                data-desc="Краткое описание портрета 1: техника, автор, год. Нажмите, чтобы узнать больше."
            ></a-plane>

            <a-plane
                id="poi-dot-2"
                class="clickable poi"
                src="#poi-image"
                position="0.5 0 0"
                rotation="-90 0 0"
                scale="0.5 0.5 0.5"
                material="transparent: true; alphaTest: 0.5; side: double;"
                data-title="Пейзаж – Москва"
                data-desc="Краткое описание пейзажа: сюжет, автор, локация. Нажмите, чтобы узнать больше."
            ></a-plane>
            
            <!-- Видимый индикатор что маркер найден -->
            <a-box position="0 0.5 0" scale="0.3 0.3 0.3" color="#FF5F27" opacity="0.5"></a-box>
        </a-marker>

        <!-- Камера -->
        <a-entity camera look-controls-enabled="false">
            <a-cursor
                id="cursor"
                color="#FF5F27"
                raycaster="objects: .clickable; far: 20"
                visible="false"
                fuse="false"
            ></a-cursor>
        </a-entity>
    </a-scene>

    <script>
        console.log('=== AR Scene Initialization Started ===');
        
        // Универсальная функция для обработки кликов
        function addUniversalClickHandler(element, handler) {
            let touchStarted = false;
            let touchMoved = false;
            
            element.addEventListener('touchstart', function(e) {
                touchStarted = true;
                touchMoved = false;
            }, { passive: true });
            
            element.addEventListener('touchmove', function(e) {
                touchMoved = true;
            }, { passive: true });
            
            element.addEventListener('touchend', function(e) {
                if (touchStarted && !touchMoved) {
                    e.preventDefault();
                    e.stopPropagation();
                    handler(e);
                }
                touchStarted = false;
                touchMoved = false;
            });
            
            element.addEventListener('click', function(e) {
                if (!touchStarted) {
                    e.preventDefault();
                    e.stopPropagation();
                    handler(e);
                }
            });
        }

        function goBack() {
            console.log('Going back to index');
            window.location.href = "index.html";
        }

        // UI элементы
        const infoPanel = document.getElementById('infoPanel');
        const overlay = document.getElementById('overlay');
        const panelTitle = document.getElementById('panelTitle');
        const panelDesc = document.getElementById('panelDesc');
        const closeBtn = document.getElementById('closePanel');
        const backButton = document.getElementById('backButton');
        const loadingScreen = document.getElementById('loadingScreen');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        const retryButton = document.getElementById('retryButton');
        const backFromError = document.getElementById('backFromError');
        const instruction = document.getElementById('instruction');

        function openInfoPanel(title, desc) {
            console.log('Opening info panel:', title);
            panelTitle.textContent = title || 'Информация';
            panelDesc.textContent = desc || '';
            infoPanel.classList.add('visible');
            overlay.classList.add('visible');
        }

        function closeInfoPanel() {
            console.log('Closing info panel');
            infoPanel.classList.remove('visible');
            overlay.classList.remove('visible');
        }
        
        function showError(message) {
            console.error('Showing error:', message);
            errorText.textContent = message;
            errorMessage.classList.add('visible');
            loadingScreen.classList.add('hidden');
        }
        
        function hideError() {
            errorMessage.classList.remove('visible');
        }

        // Обработчики кнопок
        addUniversalClickHandler(closeBtn, closeInfoPanel);
        addUniversalClickHandler(overlay, closeInfoPanel);
        addUniversalClickHandler(backButton, goBack);
        addUniversalClickHandler(retryButton, function() {
            hideError();
            location.reload();
        });
        addUniversalClickHandler(backFromError, goBack);

        // Проверка HTTPS
        if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
            console.warn('Not using HTTPS - camera may not work');
        }

        // Инициализация AR сцены
        let sceneReady = false;
        let cameraReady = false;
        
        const scene = document.querySelector('a-scene');
        const marker = document.getElementById('mainMarker');
        const cursor = document.getElementById('cursor');

        // Ждём загрузки A-Frame
        if (scene.hasLoaded) {
            console.log('Scene already loaded');
            onSceneLoaded();
        } else {
            scene.addEventListener('loaded', onSceneLoaded);
        }

        function onSceneLoaded() {
            console.log('=== Scene Loaded ===');
            sceneReady = true;
            checkInitComplete();
            
            // Добавляем обработчики для POI
            setTimeout(() => {
                document.querySelectorAll('.poi').forEach(poi => {
                    console.log('Adding click handler to:', poi.id);
                    
                    poi.addEventListener('click', function(evt) {
                        console.log('POI clicked (desktop):', poi.id);
                        const title = poi.getAttribute('data-title');
                        const desc = poi.getAttribute('data-desc');
                        openInfoPanel(title, desc);
                    });
                    
                    poi.addEventListener('touchend', function(evt) {
                        console.log('POI touched:', poi.id);
                        evt.preventDefault();
                        evt.stopPropagation();
                        const title = poi.getAttribute('data-title');
                        const desc = poi.getAttribute('data-desc');
                        openInfoPanel(title, desc);
                    });
                });
            }, 1000);
        }

        // Проверка доступа к камере
        console.log('Requesting camera access...');
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({ 
                video: { 
                    facingMode: 'environment',
                    width: { ideal: 1280 },
                    height: { ideal: 960 }
                } 
            })
            .then(function(stream) {
                console.log('✓ Camera access granted');
                cameraReady = true;
                checkInitComplete();
                
                // Останавливаем поток - AR.js создаст свой
                stream.getTracks().forEach(track => track.stop());
            })
            .catch(function(error) {
                console.error('✗ Camera access denied:', error);
                
                let message = 'Не удалось получить доступ к камере. ';
                
                if (error.name === 'NotAllowedError') {
                    message += 'Пожалуйста, разрешите доступ к камере в настройках браузера.';
                } else if (error.name === 'NotFoundError') {
                    message += 'Камера не найдена на устройстве.';
                } else if (error.name === 'NotReadableError') {
                    message += 'Камера используется другим приложением.';
                } else {
                    message += 'Ошибка: ' + error.message;
                }
                
                showError(message);
            });
        } else {
            console.error('getUserMedia not supported');
            showError('Ваш браузер не поддерживает доступ к камере. Попробуйте использовать Chrome или Safari.');
        }

        function checkInitComplete() {
            if (sceneReady && cameraReady) {
                console.log('=== AR Initialization Complete ===');
                setTimeout(() => {
                    loadingScreen.classList.add('hidden');
                }, 500);
            }
        }

        // Обработчики маркера
        if (marker) {
            marker.addEventListener('markerFound', function() {
                console.log('✓ Marker Found!');
                cursor.setAttribute('visible', 'true');
                instruction.style.display = 'none';
                
                document.querySelectorAll('.poi').forEach(p => {
                    p.setAttribute('visible', 'true');
                });
            });

            marker.addEventListener('markerLost', function() {
                console.log('✗ Marker Lost');
                cursor.setAttribute('visible', 'false');
                instruction.style.display = 'block';
                closeInfoPanel();
            });
        }

        // Обработка Escape
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                if (infoPanel.classList.contains('visible')) {
                    closeInfoPanel();
                } else {
                    goBack();
                }
            }
        });

        // Скрытие A-Frame UI
        setTimeout(function() {
            const els = document.querySelectorAll('.a-enter-vr, .a-orientation-modal, .a-dialog, .arjs-loader');
            els.forEach(e => { if (e) e.style.display = 'none'; });
        }, 100);

        // Таймаут на случай зависания
        setTimeout(() => {
            if (!sceneReady || !cameraReady) {
                console.error('Initialization timeout');
                showError('Превышено время ожидания загрузки AR. Попробуйте перезагрузить страницу.');
            }
        }, 15000);
        
        console.log('=== Script Loaded ===');
    </script>
</body>
</html>
