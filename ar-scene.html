<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <title>AR scene — 2 POI + conditional cursor</title>

    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>

    <style>
        body { margin:0; overflow:hidden; width:100vw; height:100vh; }
        .back-button { position: fixed; top:20px; left:20px; z-index:1000; background:transparent; border:none; cursor:pointer; width:60px; height:60px; padding:0; }
        .back-button img { width:100%; height:100%; }

        /* Панель информации (универсальная для двух POI) */
        .info-panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
            width: 320px;
            max-width: 90%;
            background: rgba(10,10,26,0.95);
            color: #fff;
            padding: 24px;
            border-radius: 14px;
            display: none;
            z-index: 2000;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            border: 2px solid rgba(255,95,39,0.18);
        }
        .info-panel.visible { display: block; }
        .info-panel h2 { margin: 0 0 12px 0; font-size:20px; }
        .info-panel p { margin: 0 0 18px 0; font-size:15px; color: rgba(255,255,255,0.9); }
        .panel-close-button { width:100%; padding:14px; border-radius:10px; border:none; cursor:pointer; font-size:16px; font-weight:600; background-image: url('https://github.com/Artemvga/tenderhqz9vp/raw/gh-pages/assets/sprites/PNG/Button_BG_Color.png'); background-size:cover; color:#fff; position:relative; overflow:hidden; }
        .overlay { position: fixed; inset:0; background: rgba(0,0,0,0.5); display:none; z-index:1999; }
        .overlay.visible { display:block; }

        /* Скрываем элементы A-Frame UI по умолчанию */
        .a-enter-vr, .a-orientation-modal, .a-dialog, .arjs-loader, .arjs-detect { display:none !important; }

    </style>
</head>
<body>
    <button class="back-button" onclick="goBack()" title="Назад">
        <img src="https://github.com/Artemvga/tenderhqz9vp/raw/gh-pages/assets/sprites/PNG/Button_Back.png" alt="Назад">
    </button>

    <div class="overlay" id="overlay"></div>

    <div class="info-panel" id="infoPanel">
        <div id="panelContent">
            <h2 id="panelTitle">Заголовок</h2>
            <p id="panelDesc">Описание...</p>
        </div>
        <button class="panel-close-button" id="closePanel"><span>Закрыть</span></button>
    </div>

    <!-- AR сцена -->
    <a-scene
        vr-mode-ui="enabled: false"
        loading-screen="enabled: false"
        embedded
        arjs="sourceType: webcam; debugUIEnabled: false;"
    >
        <a-assets>
            <!-- Спрайт POI (один и тот же для двух POI) -->
            <img id="poi-image" src="https://raw.githubusercontent.com/Artemvga/tenderhqz9vp/gh-pages/assets/sprites/PNG/POI_Dot.png">
        </a-assets>

        <!-- Маркер -->
        <a-marker
            id="mainMarker"
            type="pattern"
            preset="custom"
            url="assets/marker.patt"
        >
            <!-- Два POI, разные позиции / атрибуты data-* для разного текста -->
            <a-plane
                id="poi-dot-1"
                class="clickable poi"
                src="#poi-image"
                position="-0.15 0 0.05"
                rotation="-90 0 0"
                scale="0.28 0.28 0.28"
                material="transparent: true; alphaTest: 0.5; side: double;"
                data-title="Портрет 1 — Иван Иванов"
                data-desc="Краткое описание портрета 1: техника, автор, год. Нажмите, чтобы узнать больше."
            ></a-plane>

            <a-plane
                id="poi-dot-2"
                class="clickable poi"
                src="#poi-image"
                position="0.15 0 0.05"
                rotation="-90 0 0"
                scale="0.28 0.28 0.28"
                material="transparent: true; alphaTest: 0.5; side: double;"
                data-title="Пейзаж — Москва"
                data-desc="Краткое описание пейзажа: сюжет, автор, локация. Нажмите, чтобы узнать больше."
            ></a-plane>

            <!-- (опционально) небольшая подсказка/рамка на самой метке -->
            <a-entity position="0 0 0">
                <!-- тут можно добавить 3D объекты, рамки и т.п. -->
            </a-entity>
        </a-marker>

        <!-- Камера + курсор.
             Важно: курсор изначально скрыт (visible: false).
             Мы будем показывать его только когда метка найдена (markerFound). -->
        <a-entity camera>
            <a-cursor
                id="cursor"
                color="#FF5F27"
                raycaster="objects: .clickable; far: 20"
                visible="false"
            ></a-cursor>
        </a-entity>
    </a-scene>

    <script>
        function goBack() {
            window.location.href = "index.html";
        }

        // --- UI панель ---
        const infoPanel = document.getElementById('infoPanel');
        const overlay = document.getElementById('overlay');
        const panelTitle = document.getElementById('panelTitle');
        const panelDesc = document.getElementById('panelDesc');
        const closeBtn = document.getElementById('closePanel');

        function openInfoPanel(title, desc) {
            panelTitle.textContent = title || 'Информация';
            panelDesc.textContent = desc || '';
            infoPanel.classList.add('visible');
            overlay.classList.add('visible');
            overlay.onclick = closeInfoPanel;
        }

        function closeInfoPanel() {
            infoPanel.classList.remove('visible');
            overlay.classList.remove('visible');
            overlay.onclick = null;
        }

        closeBtn.addEventListener('click', closeInfoPanel);

        // --- Компонент клика который читает data-* и открывает панель ---
        AFRAME.registerComponent('click-handler', {
            init: function () {
                const el = this.el;

                // Нормальные события для A-Frame (cursor / touch / mouse)
                el.addEventListener('click', function (evt) {
                    // читаем данные с элемента (title/desc)
                    const title = el.getAttribute('data-title') || 'Информация';
                    const desc = el.getAttribute('data-desc') || '';
                    openInfoPanel(title, desc);
                });

                el.addEventListener('touchstart', function (evt) {
                    const title = el.getAttribute('data-title') || 'Информация';
                    const desc = el.getAttribute('data-desc') || '';
                    openInfoPanel(title, desc);
                    evt.stopPropagation();
                });

                // отладочные события (по желанию)
                el.addEventListener('mouseenter', function () {
                    // можно добавить подсветку POI при наведении (опционно)
                    // el.setAttribute('scale', '0.32 0.32 0.32');
                });
                el.addEventListener('mouseleave', function () {
                    // el.setAttribute('scale', '0.28 0.28 0.28');
                });
            }
        });

        // Применяем компонент ко всем POI, у которых есть класс clickable
        window.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.clickable').forEach(el => {
                if (!el.components['click-handler']) {
                    el.setAttribute('click-handler', '');
                }
            });
        });

        // --- Показ/скрытие курсора в зависимости от того, видна метка или нет ---
        const marker = document.getElementById('mainMarker');
        const cursor = document.getElementById('cursor');

        // Безопасная функция для переключения видимости курсора
        function setCursorVisible(visible) {
            if (!cursor) return;
            // a-cursor принимает атрибут visible (boolean). Меняем его.
            cursor.setAttribute('visible', visible ? 'true' : 'false');
        }

        if (marker) {
            marker.addEventListener('markerFound', () => {
                console.log('Marker found -> show cursor');
                setCursorVisible(true);

                // Можно при появлении метки включить видимость самих POI (если хотите скрыть их по умолчанию)
                document.querySelectorAll('.poi').forEach(p => p.setAttribute('visible', 'true'));
            });

            marker.addEventListener('markerLost', () => {
                console.log('Marker lost -> hide cursor & close panel');
                setCursorVisible(false);

                // Скрываем панель, если она открыта (логично: когда картина ушла — панель закрывается)
                closeInfoPanel();

                // Если POI должны быть невидимы при отсутствии метки, можно убрать их:
                // document.querySelectorAll('.poi').forEach(p => p.setAttribute('visible', 'false'));
            });
        }

        // По умолчанию: если хотите, чтобы POI были невидимы до появления метки, можно:
        // document.querySelectorAll('.poi').forEach(p => p.setAttribute('visible', 'false'));
        // но в данном примере я оставил их видимыми (они рендерятся только когда метка видна в AR).

        // Обработка Escape — если панель открыта, закрыть; иначе вернуться назад
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                if (infoPanel.classList.contains('visible')) {
                    closeInfoPanel();
                } else {
                    goBack();
                }
            }
        });

        // Некоторый defensive JS чтобы скрыть A-Frame UI элементы, если они появятся
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
                const els = document.querySelectorAll('.a-enter-vr, .a-orientation-modal, .a-dialog, .arjs-loader');
                els.forEach(e => { if (e) e.style.display = 'none'; });
            }, 100);
        });

    </script>
</body>
</html>
