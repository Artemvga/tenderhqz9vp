<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>
    <style>
        /* Сброс всех стилей */
        * {
            margin: 0;
            padding: 0;
            border: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            background: #000 !important;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) 
                     env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        
        /* Кнопка возврата - минималистичная */
        .back-button {
            position: fixed;
            top: max(15px, env(safe-area-inset-top));
            left: max(15px, env(safe-area-inset-left));
            width: 50px;
            height: 50px;
            background-color: rgba(0, 0, 0, 0.5);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }
        
        .back-button:hover, .back-button:active {
            background-color: rgba(0, 0, 0, 0.7);
            transform: scale(1.1);
        }
        
        .back-button img {
            width: 24px;
            height: 24px;
            filter: invert(1) drop-shadow(0 1px 2px rgba(0, 0, 0, 0.5));
        }
        
        /* Инструкция - минимальная */
        .instructions {
            position: fixed;
            bottom: max(15px, env(safe-area-inset-bottom));
            left: 15px;
            right: 15px;
            text-align: center;
            color: white;
            font-size: 14px;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 999;
            border-radius: 8px;
            pointer-events: none;
        }
        
        /* Индикатор загрузки */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            color: white;
            font-size: 16px;
            text-align: center;
            transition: opacity 0.3s ease;
        }
        
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 15px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Скрываем все дебаг UI от A-Frame и AR.js */
        .a-enter-vr, 
        .a-orientation-modal,
        .a-canvas-overlay,
        .a-loader-title,
        .a-dialog,
        .a-enter-vr-button,
        [data-a-position="0 2 -3"] {
            display: none !important;
            opacity: 0 !important;
            visibility: hidden !important;
        }
        
        /* Скрываем дебаг AR.js если есть */
        .arjs-loader,
        .arjs-detect,
        .arjs-debug {
            display: none !important;
        }
        
        /* Стили для a-scene чтобы заполнял весь экран */
        a-scene {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            z-index: 1 !important;
        }
        
        /* Для мобильных */
        @media (max-width: 768px) {
            .back-button {
                width: 45px;
                height: 45px;
                top: max(12px, env(safe-area-inset-top));
                left: max(12px, env(safe-area-inset-left));
            }
            
            .back-button img {
                width: 22px;
                height: 22px;
            }
            
            .instructions {
                font-size: 13px;
                padding: 6px 10px;
                bottom: max(12px, env(safe-area-inset-bottom));
                left: 12px;
                right: 12px;
            }
        }
        
        @media (max-width: 480px) {
            .back-button {
                width: 40px;
                height: 40px;
            }
            
            .back-button img {
                width: 20px;
                height: 20px;
            }
            
            .instructions {
                font-size: 12px;
            }
            
            .loading-overlay {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>
    <!-- Кнопка возврата -->
    <button class="back-button" onclick="goBack()" title="Вернуться" aria-label="Вернуться">
        <img src="assets/sprites/PNG/Button_Back.png" alt="Назад">
    </button>

    <!-- Инструкция -->
    <div class="instructions">
        Наведите камеру на маркер картины
    </div>

    <!-- Экран загрузки -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <p>Загрузка AR...</p>
    </div>

    <!-- A-Frame сцена с отключенным UI -->
    <a-scene
        vr-mode-ui="enabled: false"
        loading-screen="enabled: false"
        embedded
        renderer="antialias: true; alpha: false; logarithmicDepthBuffer: false;"
        
        arjs="
            sourceType: webcam;
            sourceWidth: 1280;
            sourceHeight: 960;
            displayWidth: 1280;
            displayHeight: 960;
            trackingMethod: best;
            debugUIEnabled: false;
            detectionMode: mono_and_matrix;
            matrixCodeType: 3x3;
            maxDetectionRate: 60;
            cameraParametersUrl: '';
        "
    >
        <!-- Маркер -->
        <a-marker
            type="pattern"
            preset="custom"
            url="assets/marker.patt"
            raycaster="objects: .clickable"
            cursor="rayOrigin: mouse"
        >
            <!-- POI -->
            <a-image
                src="assets/sprites/PNG/POI_Dot.png"
                position="0 0 0"
                scale="0.5 0.5 0.5"
                class="clickable"
                gesture-handler="minScale: 0.25; maxScale: 1.5"
            ></a-image>
        </a-marker>

        <!-- Камера -->
        <a-entity camera></a-entity>
    </a-scene>

    <script>
        function goBack() {
            window.location.href = "index.html";
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            const loadingOverlay = document.getElementById('loadingOverlay');
            const scene = document.querySelector('a-scene');
            
            // Функция скрытия загрузки
            function hideLoading() {
                loadingOverlay.style.opacity = '0';
                setTimeout(() => {
                    loadingOverlay.style.display = 'none';
                }, 300);
            }
            
            // 1. Событие загрузки сцены
            scene.addEventListener('loaded', function() {
                console.log('AR сцена загружена');
                setTimeout(hideLoading, 1000);
            });
            
            // 2. Событие начала рендеринга
            scene.addEventListener('renderstart', function() {
                console.log('AR рендеринг начат');
                setTimeout(hideLoading, 500);
            });
            
            // 3. Таймаут на всякий случай
            setTimeout(hideLoading, 3000);
            
            // 4. Обработка ошибок
            scene.addEventListener('error', function(e) {
                console.error('AR ошибка:', e.detail);
                loadingOverlay.innerHTML = 
                    '<p style="color: #ff6b6b; margin-bottom: 10px;">⚠️ Ошибка AR</p>' +
                    '<p style="margin-bottom: 20px; font-size: 14px;">Проверьте доступ к камере</p>' +
                    '<button onclick="goBack()" style="padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 14px;">Вернуться</button>';
            });
            
            // 5. Обработка клавиши Escape
            document.addEventListener('keydown', function(event) {
                if (event.key === 'Escape') {
                    goBack();
                }
            });
            
            // 6. Принудительно скрываем все лишние UI элементы
            setTimeout(function() {
                // Скрываем все элементы A-Frame UI
                const aframeUI = document.querySelectorAll('.a-enter-vr, .a-orientation-modal, .a-dialog, .arjs-loader, .arjs-debug');
                aframeUI.forEach(el => {
                    if (el) {
                        el.style.display = 'none';
                        el.style.opacity = '0';
                        el.style.visibility = 'hidden';
                    }
                });
                
                // Убеждаемся, что canvas занимает весь экран
                const canvas = document.querySelector('canvas');
                if (canvas) {
                    canvas.style.position = 'absolute';
                    canvas.style.top = '0';
                    canvas.style.left = '0';
                    canvas.style.width = '100%';
                    canvas.style.height = '100%';
                    canvas.style.zIndex = '1';
                }
            }, 100);
            
            // 7. Предотвращаем контекстное меню
            document.addEventListener('contextmenu', function(e) {
                e.preventDefault();
            });
            
            // 8. Предотвращаем масштабирование
            document.addEventListener('touchmove', function(e) {
                if (e.touches.length > 1) {
                    e.preventDefault();
                }
            }, { passive: false });
        });
    </script>
</body>
</html>
