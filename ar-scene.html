<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>AR scene – 2 POI + conditional cursor</title>

    <!-- Используем стабильные CDN версии -->
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.3.0/dist/aframe-master.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.3/aframe/build/aframe-ar.js"></script>

    <style>
        body { 
            margin:0; 
            overflow:hidden; 
            width:100vw; 
            height:100vh; 
            -webkit-user-select: none; 
            user-select: none;
            font-family: Arial, sans-serif;
        }
        
        .back-button { 
            position: fixed; 
            top:20px; 
            left:20px; 
            z-index:1000; 
            background:transparent; 
            border:none; 
            cursor:pointer; 
            width:60px; 
            height:60px; 
            padding:0;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        
        .back-button img { 
            width:100%; 
            height:100%; 
            pointer-events: none; 
        }

        /* Панель информации */
        .info-panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
            width: 320px;
            max-width: 90%;
            background: rgba(10,10,26,0.95);
            color: #fff;
            padding: 24px;
            border-radius: 14px;
            display: none;
            z-index: 2000;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            border: 2px solid rgba(255,95,39,0.18);
        }
        .info-panel.visible { display: block; }
        .info-panel h2 { 
            margin: 0 0 12px 0; 
            font-size:20px; 
            color: #ffffff;
        }
        .info-panel p { margin: 0 0 18px 0; font-size:15px; color: rgba(255,255,255,0.9); }
        
        /* Единый стиль кнопок как в index.html */
        .panel-close-button, 
        .error-button {
            width: 100%;
            padding: 16px 24px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.5), 0 0 30px rgba(255, 95, 39, 0.2);
            touch-action: manipulation;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 56px;
            margin-top: 16px;
        }
        
        .panel-close-button::before,
        .error-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            z-index: 1;
        }
        
        .panel-close-button span,
        .error-button span {
            position: relative;
            z-index: 2;
            display: block;
            width: 100%;
            text-align: center;
        }
        
        .panel-close-button:active,
        .error-button:active {
            transform: translateY(-2px) scale(0.98);
        }
        
        .overlay { 
            position: fixed; 
            inset:0; 
            background: rgba(0,0,0,0.5); 
            display:none; 
            z-index:1999;
            -webkit-tap-highlight-color: transparent;
        }
        .overlay.visible { display:block; }

        /* Экран загрузки */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #FF5F27 0%, #F130A0 100%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            transition: opacity 0.5s;
        }
        
        .loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .loading-text {
            font-size: 1.2rem;
            margin-top: 20px;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Сообщение об ошибке */
        .error-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 59, 48, 0.95);
            color: white;
            padding: 30px;
            border-radius: 15px;
            z-index: 10000;
            display: none;
            text-align: center;
            max-width: 80%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        
        .error-message.visible {
            display: block;
        }
        
        .error-message h3 {
            margin: 0 0 15px 0;
            font-size: 1.3rem;
            color: #ffffff;
        }
        
        .error-message p {
            margin: 0 0 20px 0;
            font-size: 0.95rem;
            line-height: 1.4;
            color: rgba(255, 255, 255, 0.9);
        }
        
        .error-button-container {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }
        
        .error-button {
            flex: 1;
            min-width: 120px;
            padding: 14px 20px;
            background-image: url('https://github.com/Artemvga/tenderhqz9vp/raw/gh-pages/assets/sprites/PNG/Button_BG_Color.png');
        }

        /* Скрываем элементы A-Frame UI */
        .a-enter-vr, .a-orientation-modal, .a-dialog, .arjs-loader { 
            display:none !important; 
        }
        
        /* Инструкция */
        .instruction {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 15px 25px;
            border-radius: 25px;
            z-index: 100;
            font-size: 0.9rem;
            text-align: center;
            max-width: 80%;
        }

        /* Осветляем изображение с камеры */
        video#arjs-video,
        video.arjs-video,
        .arjs-video video {
            filter: brightness(1.4) contrast(1.08) saturate(1.05);
        }
    </style>
</head>
<body>
    <!-- Экран загрузки -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-spinner"></div>
        <div class="loading-text">Инициализация AR...</div>
    </div>

    <!-- Сообщение об ошибке -->
    <div class="error-message" id="errorMessage">
        <h3>Ошибка доступа к камере</h3>
        <p id="errorText">Для работы AR необходим доступ к камере.</p>
        <div class="error-button-container">
            <button class="error-button" id="retryButton"><span>Повторить</span></button>
            <button class="error-button" id="backFromError"><span>Назад</span></button>
        </div>
    </div>

    <button class="back-button" id="backButton" title="Назад">
        <img src="https://github.com/Artemvga/tenderhqz9vp/raw/gh-pages/assets/sprites/PNG/Button_Back.png" alt="←">
    </button>

    <div class="instruction" id="instruction">Наведите камеру на картину</div>

    <div class="overlay" id="overlay"></div>

    <div class="info-panel" id="infoPanel">
        <div id="panelContent">
            <h2 id="panelTitle">Заголовок</h2>
            <p id="panelDesc">Описание...</p>
        </div>
        <button class="panel-close-button" id="closePanel"><span>Закрыть</span></button>
    </div>

    <!-- AR сцена -->
    <a-scene
        id="arScene"
        vr-mode-ui="enabled: false"
        loading-screen="enabled: false"
        renderer="logarithmicDepthBuffer: true; colorManagement: true; sortObjects: true;"
        embedded
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono; trackingMethod: best; sourceWidth: 1280; sourceHeight: 960; displayWidth: 1280; displayHeight: 960;"
    >
        <a-assets timeout="10000">
            <img id="poi-image" crossorigin="anonymous" src="https://raw.githubusercontent.com/Artemvga/tenderhqz9vp/gh-pages/assets/sprites/PNG/POI_Dot.png">
        </a-assets>

        <!-- ТВОЯ МЕТКА -->
        <a-marker
            id="0"
            type="pattern"
            preset="custom"
            url="https://github.com/Artemvga/tenderhqz9vp/blob/gh-pages/assets/mark.patt"
            raycaster="objects: .clickable"
            emitevents="true"
        >
            <!-- Два POI -->
            <a-plane
                id="poi-dot-1"
                class="clickable poi"
                src="#poi-image"
                position="-0.15 0 0.05"
                rotation="-90 0 0"
                scale="0.28 0.28 0.28"
                material="transparent: true; alphaTest: 0.5; side: double;"
                data-title="Портрет 1 – Иван Иванов"
                data-desc="Краткое описание портрета 1: техника, автор, год. Нажмите, чтобы узнать больше."
            ></a-plane>

            <a-plane
                id="poi-dot-2"
                class="clickable poi"
                src="#poi-image"
                position="0.15 0 0.05"
                rotation="-90 0 0"
                scale="0.28 0.28 0.28"
                material="transparent: true; alphaTest: 0.5; side: double;"
                data-title="Пейзаж – Москва"
                data-desc="Краткое описание пейзажа: сюжет, автор, локация. Нажмите, чтобы узнать больше."
            ></a-plane>
        </a-marker>

        <!-- Камера с курсором -->
        <a-entity camera look-controls-enabled="false">
            <a-cursor
                id="cursor"
                color="#FF5F27"
                raycaster="objects: .clickable; far: 20"
                visible="false"
                fuse="false"
            ></a-cursor>
        </a-entity>
    </a-scene>

<script>
    console.log('=== AR Scene – simple POI tap mode ===');

    // Определение iOS
    const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    // Универсальный хендлер для HTML-кнопок (назад, закрыть, ретрай и т.п.)
    function addUniversalClickHandler(element, handler) {
        if (!element) return;

        // Отдельная "версия" поведения для iOS
        if (IS_IOS) {
            element.addEventListener('click', function (e) {
                e.preventDefault();
                handler(e);
            });
            return;
        }

        // Версия для Android / десктопа
        let touchStarted = false;
        let touchMoved = false;
        let touchStartTime = 0;
        let startX = 0;
        let startY = 0;

        element.addEventListener('touchstart', function (e) {
            if (!e.touches || !e.touches[0]) return;
            touchStarted = true;
            touchMoved = false;
            touchStartTime = Date.now();
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
        }, { passive: true });

        element.addEventListener('touchmove', function (e) {
            if (!touchStarted || !e.touches || !e.touches[0]) return;
            const dx = e.touches[0].clientX - startX;
            const dy = e.touches[0].clientY - startY;
            if (Math.sqrt(dx * dx + dy * dy) > 10) {
                touchMoved = true;
            }
        }, { passive: true });

        element.addEventListener('touchend', function (e) {
            if (!touchStarted) return;
            const dt = Date.now() - touchStartTime;
            if (!touchMoved && dt < 500) {
                e.preventDefault();
                handler(e);
            }
            touchStarted = false;
            touchMoved = false;
        });

        element.addEventListener('click', function (e) {
            // На десктопе обычный клик
            if (!touchStarted) {
                e.preventDefault();
                handler(e);
            }
        });
    }

    window.addEventListener('DOMContentLoaded', function () {
        console.log('DOM loaded, init AR logic');

        // ==== UI элементы ====
        const infoPanel     = document.getElementById('infoPanel');
        const overlay       = document.getElementById('overlay');
        const panelTitle    = document.getElementById('panelTitle');
        const panelDesc     = document.getElementById('panelDesc');
        const closeBtn      = document.getElementById('closePanel');
        const backButton    = document.getElementById('backButton');
        const loadingScreen = document.getElementById('loadingScreen');
        const errorMessage  = document.getElementById('errorMessage');
        const errorText     = document.getElementById('errorText');
        const retryButton   = document.getElementById('retryButton');
        const backFromError = document.getElementById('backFromError');
        const instruction   = document.getElementById('instruction');

        const scene  = document.getElementById('arScene');
        const marker = document.getElementById('0');
        const cursor = document.getElementById('cursor'); // только для настройки rayOrigin: mouse (невидимый курсор)

        let poiElements = [];

        let sceneReady  = false;
        let cameraReady = false;
        let markerFound = false;

        // ==== Панель информации ====
        function openInfoPanel(title, desc) {
            console.log('Opening info panel:', title);
            panelTitle.textContent = title || 'Информация';
            panelDesc.textContent  = desc || '';
            infoPanel.classList.add('visible');
            overlay.classList.add('visible');
            if (instruction) instruction.style.display = 'none';
        }

        function closeInfoPanel() {
            console.log('Closing info panel');
            infoPanel.classList.remove('visible');
            overlay.classList.remove('visible');
            // Если маркер сейчас не виден — показываем подсказку обратно
            if (!markerFound && instruction) {
                instruction.style.display = 'block';
            }
        }

        function goBack() {
            console.log('Going back to index');
            window.location.href = 'index.html';
        }

        // ==== Ошибки и загрузка ====
        function showError(message) {
            console.error('AR error:', message);
            if (loadingScreen) loadingScreen.classList.add('hidden');
            if (errorMessage && errorText) {
                errorText.textContent = message;
                errorMessage.classList.add('visible');
            }
        }

        function hideError() {
            if (errorMessage) errorMessage.classList.remove('visible');
        }

        function hideLoader() {
            if (loadingScreen) loadingScreen.classList.add('hidden');
        }

        // ==== Кнопки UI ====
        addUniversalClickHandler(closeBtn, closeInfoPanel);

        // Закрываем панель только по клику по фону
        overlay.addEventListener('click', function (e) {
            if (e.target === overlay) {
                closeInfoPanel();
            }
        });

        addUniversalClickHandler(backButton, goBack);

        if (retryButton) {
            addUniversalClickHandler(retryButton, function () {
                hideError();
                location.reload();
            });
        }

        if (backFromError) {
            addUniversalClickHandler(backFromError, goBack);
        }

        // ==== Проверка HTTPS ====
        if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
            console.warn('Not using HTTPS - camera may not work correctly');
        }
        
        // ==== Настройка интерактива для POI ====
        function setupPOIInteraction() {
            console.log('Setting up POI interaction (tap near dots)');

            poiElements = Array.from(document.querySelectorAll('.poi'));

            if (!poiElements.length) {
                console.warn('No POI found (.poi)');
            }

            // Оставим прямой клик по POI (если вдруг попадём точно)
            poiElements.forEach(poi => {
                console.log('Bind POI click:', poi.id);

                poi.addEventListener('click', function (evt) {
                    if (!markerFound) {
                        console.log('POI click ignored, marker not found');
                        return;
                    }
                    console.log('POI clicked (direct):', poi.id);
                    evt.preventDefault();
                    evt.stopPropagation();

                    const title = poi.getAttribute('data-title');
                    const desc  = poi.getAttribute('data-desc');
                    openInfoPanel(title, desc);
                });

                poi.addEventListener('mouseenter', function () {
                    if (markerFound) {
                        poi.setAttribute('scale', '0.32 0.32 0.32');
                    }
                });

                poi.addEventListener('mouseleave', function () {
                    if (markerFound) {
                        poi.setAttribute('scale', '0.28 0.28 0.28');
                    }
                });
            });

            // === ГЛАВНОЕ: глобальный обработчик тапа по экрану ===
            function worldToScreen(obj3D) {
                if (!scene || !scene.camera || !obj3D) return null;

                const camera = scene.camera; // THREE.Camera
                const vector = new THREE.Vector3();
                vector.setFromMatrixPosition(obj3D.matrixWorld);
                vector.project(camera);

                const halfW = window.innerWidth / 2;
                const halfH = window.innerHeight / 2;

                return {
                    x: vector.x * halfW + halfW,
                    y: -vector.y * halfH + halfH
                };
            }

            function handleScreenTap(clientX, clientY, originalEvent) {
                if (!markerFound) {
                    // POI нет на маркере — нет смысла ловить
                    return;
                }

                // Не реагируем, если тап по UI (панель, оверлей, кнопки)
                const target = originalEvent.target;
                if (
                    infoPanel.contains(target) ||
                    overlay.contains(target) ||
                    backButton.contains(target) ||
                    errorMessage.contains(target)
                ) {
                    return;
                }

                // Если панель уже открыта — можно либо игнорить, либо менять POI.
                if (infoPanel.classList.contains('visible')) {
                    return;
                }

                let closestPoi = null;
                let closestDistSq = Infinity;

                poiElements.forEach(poi => {
                    const visible = poi.getAttribute('visible');
                    if (visible === false || visible === 'false') return;

                    const screenPos = worldToScreen(poi.object3D);
                    if (!screenPos) return;

                    const dx = screenPos.x - clientX;
                    const dy = screenPos.y - clientY;
                    const distSq = dx * dx + dy * dy;

                    if (distSq < closestDistSq) {
                        closestDistSq = distSq;
                        closestPoi = poi;
                    }
                });

                const maxRadiusPx = 80;

                if (closestPoi && closestDistSq <= maxRadiusPx * maxRadiusPx) {
                    console.log('Tap picked POI:', closestPoi.id, 'distSq=', closestDistSq);
                    const title = closestPoi.getAttribute('data-title');
                    const desc  = closestPoi.getAttribute('data-desc');
                    openInfoPanel(title, desc);
                } else {
                    console.log('Tap is too far from any POI');
                }
            }

            function onGlobalClick(e) {
                handleScreenTap(e.clientX, e.clientY, e);
            }

            function onGlobalTouchEnd(e) {
                const touch = (e.changedTouches && e.changedTouches[0]) || e.touches[0];
                if (!touch) return;
                handleScreenTap(touch.clientX, touch.clientY, e);
            }

            window.addEventListener('click', onGlobalClick);
            window.addEventListener('touchend', onGlobalTouchEnd);

            console.log('POI interaction setup complete (global tap mode)');
        }


        // ==== A-Frame сцена ====
        if (scene) {
            if (scene.hasLoaded) {
                onSceneLoaded();
            } else {
                scene.addEventListener('loaded', onSceneLoaded);
            }
        } else {
            console.error('No <a-scene> found');
            showError('Не удалось инициализировать AR-сцену.');
        }

        function onSceneLoaded() {
            console.log('=== A-Frame scene loaded ===');
            sceneReady = true;
            checkInitComplete();

            // Делаем курсор невидимым и переключаем на rayOrigin: mouse
            if (cursor) {
                try {
                    cursor.setAttribute('cursor', 'rayOrigin: mouse; fuse: false');
                    cursor.setAttribute('geometry', 'primitive: ring; radiusInner: 0.0001; radiusOuter: 0.0002');
                    cursor.setAttribute('material', 'opacity: 0; color: #FF5F27');
                } catch (e) {
                    console.warn('Failed to adjust cursor:', e);
                }
            }

            // Вешаем интерактив на POI (чуть позже, чтобы всё успело построиться)
            setTimeout(setupPOIInteraction, 500);
        }

        // ==== Доступ к камере ====
        console.log('Requesting camera access...');
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: 'environment',
                    width:  { ideal: 1280 },
                    height: { ideal: 960 }
                }
            })
            .then(function (stream) {
                console.log('✓ Camera access granted');
                cameraReady = true;
                checkInitComplete();

                // Останавливаем этот поток — AR.js создаст свой
                stream.getTracks().forEach(track => track.stop());
            })
            .catch(function (error) {
                console.error('✗ Camera access denied:', error);
                let message = 'Не удалось получить доступ к камере. ';

                if (error.name === 'NotAllowedError') {
                    message += 'Пожалуйста, разрешите доступ к камере в настройках браузера.';
                } else if (error.name === 'NotFoundError') {
                    message += 'Камера не найдена на устройстве.';
                } else if (error.name === 'NotReadableError') {
                    message += 'Камера используется другим приложением.';
                } else {
                    message += 'Ошибка: ' + error.message;
                }

                showError(message);
            });
        } else {
            console.error('getUserMedia not supported');
            showError('Ваш браузер не поддерживает доступ к камере. Попробуйте использовать Chrome или Safari.');
        }

        function checkInitComplete() {
            if (sceneReady && cameraReady) {
                console.log('=== AR initialization complete ===');
                setTimeout(hideLoader, 500);
            }
        }

        // ==== Маркер ====
        if (marker) {
            marker.addEventListener('markerFound', function () {
                console.log('✓ Marker Found!');
                markerFound = true;

                if (instruction) instruction.style.display = 'none';

                // показываем POI
                document.querySelectorAll('.poi').forEach(p => {
                    p.setAttribute('visible', 'true');
                });
            });

            marker.addEventListener('markerLost', function () {
                console.log('✗ Marker Lost');
                markerFound = false;

                // панель не закрываем
                if (!infoPanel.classList.contains('visible') && instruction) {
                    instruction.style.display = 'block';
                }

                document.querySelectorAll('.poi').forEach(p => {
                    p.setAttribute('visible', 'false');
                    p.setAttribute('scale', '0.28 0.28 0.28');
                });
            });
        } else {
            console.error('#0 not found');
            showError('Не удалось найти AR-маркер на сцене.');
        }

        // ==== Клавиша Escape ====
        document.addEventListener('keydown', function (event) {
            if (event.key === 'Escape') {
                if (infoPanel.classList.contains('visible')) {
                    closeInfoPanel();
                } else {
                    goBack();
                }
            }
        });

        // ==== Скрываем UI A-Frame / AR.js ====
        setTimeout(function () {
            const els = document.querySelectorAll('.a-enter-vr, .a-orientation-modal, .a-dialog, .arjs-loader');
            els.forEach(e => { if (e) e.style.display = 'none'; });
        }, 100);

        // Таймаут на случай зависания
        setTimeout(function () {
            if (!sceneReady || !cameraReady) {
                console.error('Initialization timeout');
                showError('Превышено время ожидания загрузки AR. Попробуйте перезагрузить страницу.');
            }
        }, 15000);

        // Устанавливаем фоны для кнопок
        setTimeout(function() {
            const buttonUrl = 'https://github.com/Artemvga/tenderhqz9vp/raw/gh-pages/assets/sprites/PNG/Button_BG_Color.png';
            
            // Устанавливаем фон для кнопок в AR сцене
            const panelCloseBtn = document.getElementById('closePanel');
            const retryBtn = document.getElementById('retryButton');
            const backErrBtn = document.getElementById('backFromError');
            
            if (panelCloseBtn) {
                panelCloseBtn.style.backgroundImage = `url('${buttonUrl}')`;
            }
            if (retryBtn) {
                retryBtn.style.backgroundImage = `url('${buttonUrl}')`;
            }
            if (backErrBtn) {
                backErrBtn.style.backgroundImage = `url('${buttonUrl}')`;
            }
        }, 500);
    });
</script>
</body>
</html>
